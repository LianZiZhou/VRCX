# [hub] CI for the VRCX Hub (the headless backend).
#
# Scoped to the `hub` branch on purpose, and separate from the repository's own
# ci.yaml. That one is dispatch-only (its `pull_request` trigger is commented
# out) and its `npm run format:check` job currently fails on ~412 files on a
# clean tree, so hooking into it would produce no usable signal. This runs on
# its own and checks only what the Hub owns.
name: Hub CI

on:
  push:
    branches:
      - hub
    paths:
      - 'src/**'
      - 'build-scripts/build-hub.js'
      - 'build-scripts/hub-merge-offline.js'
      - 'docker/**'
      - 'vitest.hub.config.js'
      - 'vitest.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/hub.yml'
  pull_request:
    branches:
      - hub
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hub-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Hub tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # The upstream-footprint test diffs against origin/master, so it needs
          # real history rather than a shallow clone.
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      # The headless boot spike, the encrypted channel, the transport,
      # derived-write suppression, mirror mode, and the footprint guard.
      - run: npm run test:hub

  lint:
    name: Hub lint and format
    runs-on: ubuntu-latest
    steps:
      # .editorconfig declares `end_of_line = crlf` for every file, and oxfmt
      # honours it. Git stores the sources LF-normalised (`* text=auto`), so a
      # default Linux checkout hands oxfmt LF files that it then rejects -- all
      # of them, which is what made this look like a config problem rather than
      # a line-ending one. Confirmed by taking a tree checked out as LF and
      # adding .editorconfig to it: 46 of 46 files flip from passing to
      # failing, and converting the same tree to CRLF flips them back.
      #
      # Checking out CRLF makes the runner match what the repo declares, and
      # matches what a Windows checkout already produces, so CI and a
      # developer's local run agree about what "formatted" means.
      - name: Match the line endings .editorconfig asks for
        run: git config --global core.autocrlf true
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      # Both tools are given `-c` and invoked through node_modules/.bin rather
      # than npx, so neither config nor binary resolution depends on the
      # environment.
      - name: Oxlint
        run: >-
          ./node_modules/.bin/oxlint -c .oxlintrc.json
          src/hub build-scripts/hub-archive.js build-scripts/package-hub.js
      - name: ESLint
        run: >-
          ./node_modules/.bin/eslint src/hub vitest.hub.config.js src/vite.hub.config.js
          build-scripts/build-hub.js build-scripts/hub-merge-offline.js
          build-scripts/hub-archive.js build-scripts/package-hub.js
      # Hub-owned paths only. Running the formatter over an upstream file
      # rewrites the whole thing -- which is exactly what the footprint test
      # exists to catch -- so this must never widen to cover them.
      - name: Format (Hub-owned files only)
        run: |
          paths="src/hub vitest.hub.config.js src/vite.hub.config.js
            build-scripts/build-hub.js build-scripts/hub-merge-offline.js
            build-scripts/hub-archive.js build-scripts/package-hub.js"

          if ./node_modules/.bin/oxfmt --check -c .oxfmtrc.json $paths > fmt.log 2>&1; then
            cat fmt.log
            exit 0
          fi

          # Downloading a job log needs admin rights on the repository;
          # annotations do not. Only the first ten per step are surfaced.
          cat fmt.log
          head -n 8 fmt.log | while IFS= read -r line; do
            echo "::error::oxfmt: $line"
          done
          exit 1

  build:
    name: Hub bundle boots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run build-hub

      # The unit tests exercise the sources; this proves the *bundle* works.
      # It is what catches a missing module alias, a shim that did not get
      # applied, or a dependency that cannot survive bundling -- none of which
      # source-level tests can see.
      - name: Boot the built bundle and query it
        run: |
          set -euo pipefail

          # Workspace-relative, so the shell and node agree on the path on any
          # runner rather than depending on how /tmp is mapped. Under build/,
          # which .gitignore already covers.
          work="$PWD/build/hub-ci"
          rm -rf "$work"
          mkdir -p "$work"

          node build/hub/main.js \
            --config="$work" --dry-run --port=9001 --status-port=9002 \
            > "$work/hub.log" 2>&1 &
          hub_pid=$!
          trap 'kill "$hub_pid" 2>/dev/null || true' EXIT

          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9002/status.json > "$work/status.json" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          if [ ! -s "$work/status.json" ]; then
            echo "::error::The Hub bundle did not come up within 30s"
            cat "$work/hub.log"
            exit 1
          fi

          cat "$work/status.json"

          # A real schema version means the data core booted and reached the
          # database layer, not merely that a socket opened.
          if ! node -e '
            const fs = require("node:fs");
            const status = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (!Number.isInteger(status.databaseVersion) || status.databaseVersion < 1) {
              throw new Error("Hub reported no database version: " + JSON.stringify(status));
            }
            console.log("Hub booted, schema v" + status.databaseVersion);
          ' "$work/status.json"; then
            cat "$work/hub.log"
            exit 1
          fi

          if ! grep -qE "Data core up: [0-9]+ stores" "$work/hub.log"; then
            echo "::error::The data core did not report its stores"
            cat "$work/hub.log"
            exit 1
          fi

      - name: Upload Hub bundle
        uses: actions/upload-artifact@v4
        with:
          name: vrcx-hub
          path: |
            build/hub/main.js
            build/hub/package.json
            build/hub/assets/
          retention-days: 7
